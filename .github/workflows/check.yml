name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/DisplayRegent/DisplayRegent.csproj -c Release --nologo
      - run: dotnet run --project tests/DisplayRegent.Tests -c Release
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-preview
          path: |
            artifacts/*Setup.exe
            artifacts/*Portable.zip
            artifacts/SHA256SUMS.txt
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
